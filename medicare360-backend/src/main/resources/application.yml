spring:
  application:
    name: medicare360-backend
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/medicare360}
      auto-index-creation: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${PORT:8080}

app:
  cors:
    allowed-origins: ${FRONTEND_URL:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:PT2H}

logging:
  level:
    org.springframework.web: DEBUG
